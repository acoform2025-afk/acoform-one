name: Check build

# Render deploys main (live) and test (preview) itself, but only after these checks pass.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # Render deploys only when all checks pass; a cancelled check would block the deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://hxlkinnosgckehogtpgb.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rCYgzLXbGnHGmNqT3zxCfA_tdyQ0b_h


  # Builds the same Docker image Render builds (incl. the LibreDWG DWG reader), so a broken image never deploys.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t acoform-one-ci .
      - run: docker run --rm --entrypoint /opt/libredwg/bin/dwg2dxf acoform-one-ci --version
